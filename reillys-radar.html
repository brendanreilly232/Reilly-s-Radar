<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reilly's Radar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    --sky-deep:#0b1220;
    --sky-mid:#101c33;
    --panel:#0f1a2e;
    --panel-line:#1e2c48;
    --ink:#eaf1ff;
    --ink-dim:#8ea3c7;
    --accent:#3ddc97;
    --accent-dim:#1f7a5c;
    --warn:#ffb347;
    --live:#ff5470;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--sky-deep);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    overflow:hidden;
  }
  #app{position:relative; height:100vh; width:100vw;}
  #map{position:absolute; inset:0; background:var(--sky-deep);}
  .leaflet-tile-pane{ filter:saturate(1.05); }

  /* Top bar */
  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    padding:14px 14px 10px 14px;
    background:linear-gradient(180deg, rgba(11,18,32,0.92) 0%, rgba(11,18,32,0.55) 70%, rgba(11,18,32,0) 100%);
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto;}
  .brand{
    display:flex; align-items:baseline; gap:8px; margin-bottom:10px;
  }
  .brand-mark{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent);
    flex-shrink:0;
    margin-bottom:2px;
  }
  .brand h1{
    font-size:17px; font-weight:700; letter-spacing:0.2px; margin:0;
  }
  .brand span.sub{
    color:var(--ink-dim); font-size:12px; font-weight:500;
  }

  .search-row{
    display:flex; gap:8px;
  }
  #search{
    flex:1;
    background:rgba(15,26,46,0.85);
    border:1px solid var(--panel-line);
    color:var(--ink);
    padding:11px 14px;
    border-radius:12px;
    font-size:15px;
    outline:none;
    backdrop-filter:blur(6px);
  }
  #search::placeholder{color:var(--ink-dim);}
  #locate-btn{
    width:44px; height:44px; flex-shrink:0;
    background:rgba(15,26,46,0.85);
    border:1px solid var(--panel-line);
    border-radius:12px;
    color:var(--accent);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px);
  }
  #search-results{
    margin-top:6px;
    background:rgba(15,26,46,0.96);
    border:1px solid var(--panel-line);
    border-radius:12px;
    overflow:hidden;
    display:none;
  }
  #search-results div{
    padding:11px 14px;
    font-size:14px;
    border-bottom:1px solid var(--panel-line);
    color:var(--ink);
  }
  #search-results div:last-child{border-bottom:none;}
  #search-results div:active{background:rgba(61,220,151,0.12);}

  /* Status pill */
  #status{
    position:absolute; top:14px; right:14px; z-index:1000;
    font-size:11px; font-weight:700; letter-spacing:0.4px;
    color:var(--ink-dim);
    text-transform:uppercase;
    display:none;
  }

  /* Bottom control panel */
  #panel{
    position:absolute; left:0; right:0; bottom:0; z-index:1000;
    background:linear-gradient(0deg, rgba(11,18,32,0.97) 60%, rgba(11,18,32,0.85) 90%, rgba(11,18,32,0) 100%);
    padding:10px 14px calc(14px + env(safe-area-inset-bottom)) 14px;
  }

  .timeline-wrap{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:var(--radius);
    padding:12px 14px 10px 14px;
    margin-bottom:10px;
  }
  .timeline-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px;
  }
  #frame-label{
    font-size:14px; font-weight:700;
  }
  #frame-label .rel{
    color:var(--accent); font-weight:700;
  }
  #frame-label.future .rel{color:var(--warn);}
  #legend-mini{
    display:flex; align-items:center; gap:5px; font-size:10px; color:var(--ink-dim); font-weight:600;
  }
  .legend-grad{
    width:60px; height:6px; border-radius:3px;
    background:linear-gradient(90deg, #3ddc97 0%, #ffe066 40%, #ff9f45 65%, #ff5470 85%, #b33dff 100%);
  }

  #slider{
    -webkit-appearance:none; appearance:none;
    width:100%; height:32px;
    background:transparent;
    margin:0;
  }
  #slider::-webkit-slider-runnable-track{
    height:5px; border-radius:3px;
    background:var(--panel-line);
  }
  #slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px; height:20px; border-radius:50%;
    background:var(--accent);
    border:3px solid var(--sky-deep);
    margin-top:-8px;
    box-shadow:0 0 0 1px var(--accent);
  }

  .ticks{
    display:flex; justify-content:space-between;
    font-size:9px; color:var(--ink-dim); font-weight:600;
    padding:0 2px; margin-top:-2px;
  }

  .controls-row{
    display:flex; gap:8px; align-items:stretch;
  }
  #play-btn{
    width:52px; flex-shrink:0;
    background:var(--accent);
    border:none;
    border-radius:14px;
    color:#08281c;
    font-size:19px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  #play-btn:active{background:var(--accent-dim); color:#eaf1ff;}

  .chip-row{
    flex:1;
    display:flex; gap:6px; overflow-x:auto;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--ink-dim);
    font-size:12px; font-weight:600;
    padding:0 14px;
    border-radius:14px;
    display:flex; align-items:center;
    white-space:nowrap;
  }
  .chip.active{
    background:rgba(61,220,151,0.14);
    border-color:var(--accent);
    color:var(--accent);
  }

  #loading{
    position:absolute; inset:0; z-index:2000;
    background:var(--sky-deep);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    transition:opacity 0.4s ease;
  }
  .spinner{
    width:36px; height:36px; border-radius:50%;
    border:3px solid var(--panel-line);
    border-top-color:var(--accent);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading p{color:var(--ink-dim); font-size:13px; font-weight:600; margin:0;}

  #error-toast{
    position:absolute; top:70px; left:14px; right:14px; z-index:1500;
    background:rgba(255,84,112,0.16);
    border:1px solid var(--live);
    color:#ffd7dd;
    padding:10px 14px;
    border-radius:12px;
    font-size:13px;
    display:none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <h1>Reilly's Radar</h1>
      <span class="sub">live UK rain · free</span>
    </div>
    <div class="search-row">
      <input id="search" type="text" placeholder="Search a UK town or postcode..." autocomplete="off">
      <button id="locate-btn">◎</button>
    </div>
    <div id="search-results"></div>
  </div>

  <div id="status"></div>
  <div id="error-toast"></div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Loading radar frames…</p>
  </div>

  <div id="panel">
    <div class="timeline-wrap">
      <div class="timeline-head">
        <div id="frame-label">—</div>
        <div id="legend-mini">
          <span class="legend-grad"></span>
          <span>light → heavy</span>
        </div>
      </div>
      <input type="range" id="slider" min="0" max="0" value="0" step="1">
      <div class="ticks">
        <span>-2h</span><span>-1h</span><span>now</span><span>+30m</span>
      </div>
    </div>
    <div class="controls-row">
      <button id="play-btn">▶</button>
      <div class="chip-row" id="chip-row">
        <div class="chip active" data-view="uk">Country</div>
        <div class="chip" data-view="regional">Regional</div>
        <div class="chip" data-view="local">Local</div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- Map setup, centred on UK ----
  var map = L.map('map', {
    zoomControl:false,
    attributionControl:true,
    center:[54.5, -3.0],
    zoom:6,
    minZoom:4,
    maxZoom:12
  });

  L.control.attribution({position:'bottomright', prefix:false}).addTo(map);

  // Dark basemap (CARTO dark, free, no key)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO · Radar: RainViewer',
    subdomains:'abcd',
    maxZoom:19
  }).addTo(map);

  var VIEWS = {
    uk:      {center:[54.5,-3.0], zoom:6},
    regional:{center:[54.5,-3.0], zoom:8},
    local:   {center:[54.5,-3.0], zoom:11}
  };

  document.getElementById('chip-row').addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if(!chip) return;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    var v = VIEWS[chip.dataset.view];
    map.flyTo(v.center, v.zoom, {duration:0.8});
  });

  // ---- Radar layer via RainViewer ----
  var radarLayer = null;
  var frames = [];      // {time, path}
  var currentIndex = 0;
  var playing = false;
  var playTimer = null;

  var COLOR_SCHEME = 4; // RainViewer scheme: 4 = "Universal Blue" style, vivid
  var TILE_SIZE = 256;
  var SMOOTH = 1;
  var SNOW = 1;

  function tileUrlFor(frame){
    return 'https://tilecache.rainviewer.com' + frame.path + '/' + TILE_SIZE + '/{z}/{x}/{y}/' + COLOR_SCHEME + '/' + SMOOTH + '_' + SNOW + '.png';
  }

  function setFrame(index){
    if(!frames.length) return;
    currentIndex = ((index % frames.length) + frames.length) % frames.length;
    var frame = frames[currentIndex];

    var newLayer = L.tileLayer(tileUrlFor(frame), {
      opacity:0.75,
      zIndex:200,
      tileSize:256
    });
    newLayer.addTo(map);

    if(radarLayer){
      var old = radarLayer;
      setTimeout(function(){ map.removeLayer(old); }, 250);
    }
    radarLayer = newLayer;

    document.getElementById('slider').value = currentIndex;
    updateFrameLabel(frame);
  }

  function updateFrameLabel(frame){
    var el = document.getElementById('frame-label');
    var now = Math.floor(Date.now()/1000);
    var diffMin = Math.round((frame.time - now) / 60);
    var d = new Date(frame.time * 1000);
    var timeStr = d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});

    var relStr;
    if (diffMin > 1) { relStr = '+' + diffMin + ' min (forecast)'; el.classList.add('future'); }
    else if (diffMin < -1) { relStr = diffMin + ' min ago'; el.classList.remove('future'); }
    else { relStr = 'now'; el.classList.remove('future'); }

    el.innerHTML = timeStr + ' &nbsp;·&nbsp; <span class="rel">' + relStr + '</span>';
  }

  function showError(msg){
    var t = document.getElementById('error-toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(function(){ t.style.display = 'none'; }, 5000);
  }

  function loadRadarData(retriesLeft){
    if (retriesLeft === undefined) retriesLeft = 2;
    fetch('https://api.rainviewer.com/public/weather-maps.json', {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('Network error ' + r.status);
        return r.json();
      })
      .then(function(data){
        var past = (data.radar && data.radar.past) || [];
        var nowcast = (data.radar && data.radar.nowcast) || [];
        frames = past.concat(nowcast);
        if(!frames.length) throw new Error('No frames returned');

        var slider = document.getElementById('slider');
        slider.max = frames.length - 1;

        // start on the most recent "past" frame (i.e. last index of `past`)
        var startIndex = Math.max(0, past.length - 1);
        setFrame(startIndex);

        document.getElementById('loading').style.opacity = '0';
        setTimeout(function(){
          document.getElementById('loading').style.display = 'none';
        }, 400);
      })
      .catch(function(err){
        console.error(err);
        if (retriesLeft > 0){
          setTimeout(function(){ loadRadarData(retriesLeft - 1); }, 1200);
          return;
        }
        document.getElementById('loading').style.display = 'none';
        var isLocalFile = window.location.protocol === 'file:';
        showError(isLocalFile
          ? "Load failed — your browser is blocking requests because you opened this file directly. Try uploading it to a free host (GitHub Pages/Netlify) or opening it via a local server instead of double-clicking it."
          : "Could not load radar data — check your connection and try again.");
      });
  }

  document.getElementById('slider').addEventListener('input', function(e){
    stopPlay();
    setFrame(parseInt(e.target.value, 10));
  });

  // ---- Play / pause animation ----
  function startPlay(){
    playing = true;
    document.getElementById('play-btn').textContent = '❚❚';
    playTimer = setInterval(function(){
      var next = currentIndex + 1;
      if(next >= frames.length){ next = 0; }
      setFrame(next);
    }, 600);
  }
  function stopPlay(){
    playing = false;
    document.getElementById('play-btn').textContent = '▶';
    clearInterval(playTimer);
  }
  document.getElementById('play-btn').addEventListener('click', function(){
    if(playing) stopPlay(); else startPlay();
  });

  // ---- Geolocation ----
  document.getElementById('locate-btn').addEventListener('click', function(){
    var status = document.getElementById('status');
    status.style.display = 'block';
    status.textContent = 'Locating…';
    if(!navigator.geolocation){
      showError('Geolocation is not available on this device.');
      status.style.display = 'none';
      return;
    }
    navigator.geolocation.getCurrentPosition(function(pos){
      map.flyTo([pos.coords.latitude, pos.coords.longitude], 10, {duration:1});
      status.style.display = 'none';
    }, function(){
      showError('Could not get your location.');
      status.style.display = 'none';
    }, {timeout:8000});
  });

  // ---- Search (UK places via free Nominatim/OSM API) ----
  var searchInput = document.getElementById('search');
  var resultsBox = document.getElementById('search-results');
  var searchDebounce = null;

  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim();
    clearTimeout(searchDebounce);
    if(q.length < 3){
      resultsBox.style.display = 'none';
      resultsBox.innerHTML = '';
      return;
    }
    searchDebounce = setTimeout(function(){ runSearch(q); }, 400);
  });

  function runSearch(q){
    var url = 'https://nominatim.openstreetmap.org/search?format=json&countrycodes=gb&limit=5&q=' + encodeURIComponent(q);
    fetch(url, {headers:{'Accept':'application/json'}})
      .then(function(r){ return r.json(); })
      .then(function(results){
        resultsBox.innerHTML = '';
        if(!results.length){
          resultsBox.style.display = 'none';
          return;
        }
        results.forEach(function(res){
          var div = document.createElement('div');
          div.textContent = res.display_name;
          div.addEventListener('click', function(){
            map.flyTo([parseFloat(res.lat), parseFloat(res.lon)], 10, {duration:1});
            resultsBox.style.display = 'none';
            searchInput.value = res.display_name.split(',')[0];
            searchInput.blur();
          });
          resultsBox.appendChild(div);
        });
        resultsBox.style.display = 'block';
      })
      .catch(function(){
        resultsBox.style.display = 'none';
      });
  }

  // Kick off
  loadRadarData();
  // Refresh frame list every 5 minutes to pick up new radar sweeps
  setInterval(loadRadarData, 5 * 60 * 1000);

})();
</script>
</body>
</html>
